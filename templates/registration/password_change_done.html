{% extends 'temp_base/base_log.html' %}
{% block titulo %}Senha Alterada{% endblock %}
{% block tema %}Senha alterada com sucesso{% endblock %}

{% block formulario %}
<div class="flex flex-col items-center text-center gap-6 py-4">
  <div class="rounded-full bg-success/10 p-5">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
  </div>

  <div>
    <p class="text-base-content/60 text-sm leading-relaxed">
      Sua senha foi atualizada. Você já pode usar a nova senha no próximo acesso.
    </p>
  </div>

  <div class="flex flex-col gap-3 w-full">
    <a href="{% url 'escola:painel_escola' %}" class="btn btn-primary w-full">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"/></svg>
      Ir ao painel
    </a>
    <a href="{% url 'core:inicio' %}" class="btn btn-ghost w-full">Voltar ao início</a>
  </div>
</div>
{% endblock %}
