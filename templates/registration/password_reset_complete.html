{% extends 'registration/base_auth.html' %}

{% block titulo %}Senha Redefinida{% endblock %}

{% block tema %}Tudo pronto!{% endblock %}

{% block conteudo %}
<div class="space-y-6">

    <!-- Ícone de sucesso com animação sutil -->
    <div class="flex justify-center">
        <div class="flex items-center justify-center w-20 h-20 rounded-2xl bg-success/10 text-success">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="1.6">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
        </div>
    </div>

    <div class="text-center space-y-2">
        <p class="text-base-content font-semibold">Senha redefinida com sucesso</p>
        <p class="text-sm text-base-content/50 leading-relaxed">
            Sua nova senha foi salva. Agora você pode acessar o sistema normalmente.
        </p>
    </div>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-full">
        Fazer login
    </a>

</div>
{% endblock %}
