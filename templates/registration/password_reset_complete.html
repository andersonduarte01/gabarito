{% extends 'temp_base/base_log.html' %}
{% block titulo %}Senha Redefinida{% endblock %}
{% block tema %}Senha redefinida com sucesso{% endblock %}

{% block formulario %}
<div class="flex flex-col items-center text-center gap-6 py-4">
  <div class="rounded-full bg-success/10 p-5">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
  </div>

  <div>
    <p class="text-base-content/60 text-sm leading-relaxed">
      Sua nova senha foi salva. Você já pode entrar na plataforma usando as novas credenciais.
    </p>
  </div>

  <a href="{% url 'login' %}" class="btn btn-primary w-full">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"/></svg>
    Entrar agora
  </a>
</div>
{% endblock %}
