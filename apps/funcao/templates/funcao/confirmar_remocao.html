{% extends 'base.html' %}

{% block titulo %}Remover Função{% endblock %}
{% block titulo_pagina %}Remover Função{% endblock %}

{% block conteudo %}
<div class="max-w-md">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body p-6 items-center text-center">
            <div class="flex items-center justify-center w-16 h-16 rounded-full bg-error/15 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <h2 class="text-lg font-bold text-base-content">Confirmar remoção</h2>
            <p class="text-sm text-base-content/70 mt-1">
                Deseja remover a função <strong>{{ object.funcao }}</strong>?
            </p>
            <div class="flex flex-col-reverse sm:flex-row gap-3 mt-6 w-full">
                <a href="{% url 'funcao:lista_funcoes' %}" class="btn btn-ghost w-full sm:w-auto">Cancelar</a>
                <form method="post" class="w-full sm:w-auto sm:ml-auto">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-error w-full">Remover</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
