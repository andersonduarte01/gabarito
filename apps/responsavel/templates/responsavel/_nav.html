{% with a=active %}

<a href="{% url 'responsavel:portal_dashboard' %}"
   title="Dashboard"
   class="sidebar-nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
          {% if a == 'dashboard' %}bg-violet-600/10 text-violet-700 dark:bg-violet-600/20 dark:text-violet-400
          {% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white{% endif %}">
    <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
    <span class="sidebar-label">Dashboard</span>
</a>

<div class="my-2 border-t border-slate-100 dark:border-slate-700"></div>

<a href="{% url 'responsavel:portal_perfil' %}"
   title="Meu Perfil"
   class="sidebar-nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
          {% if a == 'perfil' %}bg-violet-600/10 text-violet-700 dark:bg-violet-600/20 dark:text-violet-400
          {% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white{% endif %}">
    <i data-lucide="user-circle" class="w-4 h-4 shrink-0"></i>
    <span class="sidebar-label">Meu Perfil</span>
</a>

{% endwith %}
