<a href="{% url url %}"
   class="group flex items-center gap-3 px-3 py-2 rounded-xl
          hover:bg-slate-50 transition-colors">

    <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 transition-colors
        {% if color == 'primary' %}bg-primary/10 text-primary group-hover:bg-primary/15
        {% elif color == 'emerald' %}bg-emerald-50 text-emerald-600 group-hover:bg-emerald-100
        {% elif color == 'violet' %}bg-violet-50 text-violet-500 group-hover:bg-violet-100
        {% elif color == 'orange' %}bg-orange-50 text-orange-500 group-hover:bg-orange-100
        {% elif color == 'amber' %}bg-amber-50 text-amber-600 group-hover:bg-amber-100
        {% elif color == 'teal' %}bg-teal-50 text-teal-600 group-hover:bg-teal-100
        {% else %}bg-slate-100 text-slate-500 group-hover:bg-slate-200{% endif %}">

        {% if icon == 'squares' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25
                         a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6z
                         M3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18
                         a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25z
                         M13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25
                         A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6z
                         M13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18
                         A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
            </svg>

        {% elif icon == 'user-group' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656
                         -.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7
                         20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288
                         0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0
                         014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>

        {% elif icon == 'academic-cap' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M12 14l9-5-9-5-9 5 9 5z"/>
                <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952
                         11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998
                         12.078 12.078 0 01.665-6.479L12 14z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0
                         01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0
                         00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6
                         v-7.5l4-2.222"/>
            </svg>

        {% elif icon == 'identification' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0
                         002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0
                         00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875
                         1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721
                         6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376
                         0 016.338 0z"/>
            </svg>

        {% elif icon == 'newspaper' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2
                         13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2
                         m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
            </svg>

        {% elif icon == 'document' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414
                         A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>

        {% elif icon == 'book' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3
                         6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253
                         m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5
                         1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477
                         -4.5 1.253"/>
            </svg>

        {% elif icon == 'settings' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0
                         002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0
                         001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0
                         00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0
                         00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724
                         0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724
                         0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724
                         0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296
                         .07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>

        {% elif icon == 'location' %}
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244
                         -4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>

        {% endif %}
    </div>

    <span class="text-[13px] font-medium text-slate-700 group-hover:text-primary transition-colors">
        {{ label }}
    </span>

    <svg xmlns="http://www.w3.org/2000/svg"
         class="w-3 h-3 text-slate-200 ml-auto shrink-0
                group-hover:text-primary/40 transition-colors"
         fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
    </svg>

</a>
